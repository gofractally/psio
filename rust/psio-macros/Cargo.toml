[package]
name = "psio-macros"
version = "0.1.0"
edition = "2021"
description = "Derive macros for psio serialization formats (pSSZ, JSON, keys, Cap'n Proto, FlatBuffers, WIT)"
license = "MIT"

[lib]
proc-macro = true

[features]
default = []
# The derives of the formats psio compiles by feature.
capnp = []
flatbuf = []
wit = []
dynamic-view = []
# The derives of psio::experimental::frac, a format kept for benchmarks.
experimental-frac = ["dep:darling", "dep:proc-macro-error"]

[dependencies]
darling = { version = "0.14", optional = true }
proc-macro-error = { version = "1.0.4", optional = true }
proc-macro2 = "1.0.36"
quote = "1.0.15"
syn = { version = "1.0.86", features = ["full", "visit", "visit-mut"] }
