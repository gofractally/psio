[package]
name = "psio"
version = "0.1.0"
edition = "2021"
description = "Multi-format serialization: pSSZ, pjson, JSON, memcmp-sortable keys, SSZ, Cap'n Proto, FlatBuffers, WIT"
license = "MIT"

[lib]
path = "src/lib.rs"

# Historical draft-spec reference, excluded from normal library builds.
# It does not define the public C++ wire contract.
[[bin]]
name = "pjson_conformance_driver"
path = "src/bin/pjson_conformance_driver.rs"
required-features = ["historical-draft-reference"]

[dependencies]
# Used by psio::experimental::frac only.
custom_error = { version = "1.9.2", optional = true }
hex = { version = "0.3.1", optional = true }
indexmap = { version = "2.2.6", features = ["serde"], optional = true }
serde-aux = { version = "4.5", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
# psio enables no serde_json feature that changes what serde_json does for
# the other crates of a program (Cargo unifies features across the graph):
# no `arbitrary_precision`, no `preserve_order`, no `float_roundtrip`.
# `raw_value` only adds the `RawValue` type and the private newtype name it
# is requested by; psio::serde_bridge asks for a value's exact text through
# it, so reading through serde accepts what from_ijson does.
serde_json = { version = "1.0.135", features = ["raw_value"] }
psio-macros = { version = "0.1.0", path = "../psio-macros" }
paste = "1"
# Shortest round-trip float digits, the algorithm of C++ std::to_chars
# (already in the tree through serde_json).
ryu = "1"

# Competitor Rust libraries, gated behind features.  Default build
# (`cargo build`, `cargo test`) pulls nothing extra; benches opt in.
ethereum_ssz        = { version = "0.7",  optional = true }
ethereum_ssz_derive = { version = "0.7",  optional = true }
ssz_types           = { version = "0.8",  optional = true }
typenum             = { version = "1",    optional = true }
ssz_rs              = { version = "0.9",  optional = true }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# Conversions between psio::time and chrono (feature `chrono`).
chrono = { version = "0.4.38", default-features = false, optional = true }
# psio's leaf types as async-graphql scalars (feature `async-graphql`).
async-graphql = { version = "7.0.17", default-features = false, optional = true }

[features]
default = []
# `TryFrom` between psio::time values and chrono::DateTime / chrono::TimeDelta.
chrono = ["dep:chrono"]
# psio::graphql_scalars: psio::time values, RawString, the bounded strings and
# Uint256 are async-graphql scalars, and `psio::async_graphql_scalar!` makes
# one of any JsonText type. async-graphql is taken without its default
# features; it adds nothing to serde_json's.
async-graphql = ["dep:async-graphql"]
# psio::experimental::frac: a format kept to benchmark pSSZ against. Not a
# supported wire format.
experimental-frac = ["psio-macros/experimental-frac", "dep:custom_error", "dep:hex",
                     "dep:indexmap", "dep:serde-aux"]
historical-draft-reference = []
bench_ethereum_ssz = ["dep:ethereum_ssz", "dep:ethereum_ssz_derive",
                       "dep:ssz_types", "dep:typenum"]
bench_ssz_rs       = ["dep:ssz_rs"]

[dev-dependencies]
# Tests, benches and examples build the crate with the experimental formats,
# so `cargo test` covers them while a plain dependency on psio does not
# compile them.
psio = { path = ".", features = ["experimental-frac"] }
criterion = { version = "0.5", features = ["html_reports"] }
hex = "0.3.1"
bincode = "1"
borsh = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
rmp-serde = "1"
rkyv = { version = "0.8", features = ["bytecheck"] }
# Bench only: raw parse speed of a candidate JSON syntax layer
# (benches/json_text_bench.rs). Not a dependency of the library.
simd-json = "0.14"

[[bench]]
name = "psio_vs_externals"
harness = false

[[bench]]
name = "pjson_bench"
harness = false

[[bench]]
name = "json_text_bench"
harness = false
